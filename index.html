<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Enhancer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Reading
      // localStorage throws outright when site data is blocked, so this is
      // guarded — an exception here would stop the module scripts below.
      try {
        const saved = localStorage.getItem('pe.theme')
        if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="h-full bg-(--surface-page) text-(--text-secondary) antialiased">
    <div x-data="mainApp" x-cloak class="app-frame flex h-full flex-col">
      <!-- Header -->
      <header class="flex items-center justify-between border-b border-(--border-default) bg-(--surface-header) px-4 py-3 backdrop-blur sm:px-6">
        <a href="./" class="flex min-w-0 items-center gap-2.5">
          <span class="grid size-8 shrink-0 place-items-center rounded-(--radius-sm) bg-(--accent-soft) text-lg">✨</span>
          <!-- Truncates rather than wrapping: a two-line wordmark doubled the
               header's height on a phone, where vertical space is scarcest. -->
          <span class="truncate text-base font-semibold tracking-tight text-(--text-primary)">Prompt Enhancer</span>
        </a>
        <nav class="flex shrink-0 items-center gap-1 text-sm">
          <a href="./" class="btn btn-soft">Enhance</a>
          <a href="./settings.html" class="btn btn-ghost">Settings</a>
          <button
            @click="toggleTheme()"
            :title="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
            class="btn btn-ghost ml-1 px-2.5"
            x-text="theme === 'dark' ? '☀️' : '🌙'"
          ></button>
        </nav>
      </header>

      <!-- Storage failure notice: stays up until a later save succeeds -->
      <p
        x-show="storageError"
        x-cloak
        role="alert"
        class="mx-4 mt-4 rounded-(--radius-md) bg-(--danger-soft) px-4 py-2.5 text-sm text-(--danger) sm:mx-6"
        x-text="storageError"
      ></p>

      <!-- Unreadable stored data: says what was set aside, dismissible -->
      <div
        x-show="dataNotice"
        x-cloak
        role="status"
        class="mx-4 mt-4 flex items-start gap-3 rounded-(--radius-md) bg-(--warning-soft) px-4 py-2.5 text-sm text-(--warning) sm:mx-6"
      >
        <span class="min-w-0 flex-1" x-text="dataNotice"></span>
        <button @click="dataNotice = ''" class="btn btn-ghost btn-xs shrink-0">Dismiss</button>
      </div>

      <!-- Main: sessions sidebar + enhancement chain + Markdown preview.
           The preview is a full-width strip below the chain on md, and the
           fourth column (its own grid track) on xl and up. The grid itself
           lives in .app-layout (style.css); the sidebar and preview widths
           are CSS variables set inline from the persisted layout state, and
           each of those panes carries a drag handle in the gap beside it. -->
      <main x-ref="layout" :style="layoutStyle" :class="layout.previewCollapsed ? 'app-layout-no-preview' : ''" class="app-layout min-h-0 flex-1 gap-4 p-4">
        <!-- Left: sessions -->
        <!-- The stacked cap is generous enough to show whole session rows: at
             max-h-48 the list got ~60px between the search box and the
             Export/Import footer and sliced a row in half. The page scrolls
             below md, so the extra height costs the chain nothing. -->
        <aside x-ref="sidebarPane" class="card relative flex max-h-64 min-h-0 flex-col md:max-h-none">
          <div
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize sessions sidebar"
            :aria-valuenow="paneWidth('sidebar')"
            :aria-valuemin="paneLimits.sidebar.min"
            :aria-valuemax="paneLimits.sidebar.max"
            tabindex="0"
            title="Drag to resize · double-click to reset"
            @pointerdown="startResize('sidebar', $event)"
            @keydown="resizeKey('sidebar', $event)"
            @dblclick="resetPane('sidebar')"
            class="resize-handle resize-handle-end"
            :class="resizing === 'sidebar' ? 'is-active' : ''"
          ></div>
          <div class="flex items-center justify-between border-b border-(--border-default) px-4 py-3">
            <h2 class="text-sm font-semibold text-(--text-primary)">Sessions</h2>
            <button @click="createSession()" class="btn btn-primary btn-xs">+ New</button>
          </div>
          <div x-show="sessions.length > 1" class="border-b border-(--border-default) px-2 py-2">
            <input
              type="search"
              x-model="sessionQuery"
              placeholder="Search sessions…"
              aria-label="Search sessions by title or prompt text"
              class="field field-xs"
            />
          </div>
          <ul class="min-h-0 flex-1 space-y-1 overflow-y-auto p-2">
            <!-- `matchesQuery` also runs over archived sessions, so a bare
                 "No sessions match" contradicted the Archived section below it.
                 x-if, not x-show: counting archived matches means filtering and
                 sorting every session, and that must not run on each render
                 when there is no query — session switches are on this path. -->
            <template x-if="visibleSessions.length === 0 && sessionQuery">
              <li
                class="px-3 py-2 text-xs text-(--text-faint)"
                x-text="archivedSessions.length
                  ? `No active sessions match — ${archivedSessions.length} in Archived below.`
                  : 'No sessions match.'"
              ></li>
            </template>
            <template x-for="s in visibleSessions" :key="s.id">
              <li>
                <div
                  class="group flex w-full items-start justify-between gap-2 rounded-(--radius-md) px-3 py-2 transition"
                  :class="s.id === activeId ? 'bg-(--accent-soft) ring-1 ring-(--accent-ring)' : 'hover:bg-(--surface-hover)'"
                >
                  <!-- Inline rename: Enter/blur commits, Escape cancels -->
                  <template x-if="renamingId === s.id">
                    <input
                      type="text"
                      x-model="renameDraft"
                      x-init="$nextTick(() => { $el.focus(); $el.select() })"
                      @keydown.enter.prevent="commitRename()"
                      @keydown.escape.prevent="cancelRename()"
                      @blur="commitRename()"
                      aria-label="Session title"
                      class="field field-xs min-w-0 flex-1"
                    />
                  </template>
                  <template x-if="renamingId !== s.id">
                    <button @click="openSession(s.id)" @dblclick="startRename(s)" :aria-current="s.id === activeId ? 'true' : null" title="Double-click to rename" class="flex min-w-0 flex-1 items-start gap-1.5 text-left">
                      <span class="min-w-0">
                        <span class="block truncate text-sm" :class="s.id === activeId ? 'font-medium text-(--text-primary)' : 'text-(--text-secondary)'" x-text="s.title"></span>
                        <span class="mt-0.5 block truncate text-xs whitespace-nowrap text-(--text-muted)">
                          <span x-text="formatDate(s.updatedAt)"></span>
                          · <span x-text="s.chain.length"></span> links
                        </span>
                      </span>
                    </button>
                  </template>
                  <span class="mt-0.5 flex shrink-0 items-center gap-1.5">
                    <!-- Rename: switches the title to an inline field -->
                    <button
                      type="button"
                      @click.stop="startRename(s)"
                      aria-label="Rename session"
                      title="Rename"
                      class="btn-icon hidden cursor-pointer text-(--text-muted) group-hover:inline-flex group-focus-within:inline-flex hover:text-(--text-secondary)"
                    >
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
                      </svg>
                    </button>
                    <!-- Star: persistent accent marker when set, revealed on hover otherwise -->
                    <button
                      type="button"
                      @click.stop="toggleStar(s.id)"
                      :aria-label="s.starred ? 'Unstar session' : 'Star session'"
                      :title="s.starred ? 'Unstar' : 'Star'"
                      class="btn-icon cursor-pointer transition"
                      :class="s.starred ? 'text-(--accent-text)' : 'hidden text-(--text-muted) group-hover:inline-flex group-focus-within:inline-flex hover:text-(--text-secondary)'"
                    >
                      <svg viewBox="0 0 24 24" :fill="s.starred ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linejoin="round" class="h-3.5 w-3.5">
                        <path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6.1L12 17l-5.5 2.7 1.2-6.1L3.2 9.4l6.1-.8L12 3z" />
                      </svg>
                    </button>
                    <!-- Pin: keeps the session at the top of the list -->
                    <button
                      type="button"
                      @click.stop="togglePin(s.id)"
                      :aria-label="s.pinned ? 'Unpin session' : 'Pin session'"
                      :title="s.pinned ? 'Unpin' : 'Pin to top'"
                      class="btn-icon cursor-pointer transition"
                      :class="s.pinned ? 'text-(--accent-text)' : 'hidden text-(--text-muted) group-hover:inline-flex group-focus-within:inline-flex hover:text-(--text-secondary)'"
                    >
                      <svg viewBox="0 0 24 24" :fill="s.pinned ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
                        <path d="M12 21v-6" />
                        <path d="M8 4h8l-1 5 2.5 2.5V13H6.5v-1.5L9 9 8 4z" />
                      </svg>
                    </button>
                    <!-- Archive: tuck out of the main list -->
                    <button
                      type="button"
                      @click.stop="toggleArchive(s.id)"
                      aria-label="Archive session"
                      title="Archive"
                      class="btn-icon hidden cursor-pointer text-(--text-muted) group-hover:inline-flex group-focus-within:inline-flex hover:text-(--text-secondary)"
                    >
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
                        <rect x="3" y="4" width="18" height="4" rx="1" />
                        <path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8" />
                        <path d="M10 12h4" />
                      </svg>
                    </button>
                    <button type="button"
                      @click.stop="deleteSession(s.id)"
                      aria-label="Delete session"
                      title="Delete session"
                      class="btn-icon hidden cursor-pointer text-(--text-muted) group-hover:inline-flex group-focus-within:inline-flex hover:text-(--danger)"
                    >✕</button>
                  </span>
                </div>
              </li>
            </template>
          </ul>

          <!-- Archived sessions: collapsed by default, restore or delete only -->
          <div x-show="archivedSessions.length > 0" x-cloak class="border-t border-(--border-default)">
            <button
              @click="showArchived = !showArchived"
              class="flex w-full items-center justify-between px-4 py-2.5 text-xs text-(--text-muted) hover:text-(--text-secondary)"
            >
              <span>Archived · <span x-text="archivedSessions.length" class="tabular-nums"></span></span>
              <span x-text="showArchived ? '▲' : '▼'"></span>
            </button>
            <ul x-show="showArchived" x-cloak class="max-h-40 space-y-1 overflow-y-auto px-2 pb-2">
              <template x-for="s in archivedSessions" :key="s.id">
                <li>
                  <div class="group flex w-full items-start justify-between gap-2 rounded-(--radius-md) px-3 py-2 transition hover:bg-(--surface-hover)">
                    <button @click="openSession(s.id)" class="min-w-0 flex-1 text-left">
                      <span class="block truncate text-sm text-(--text-secondary)" x-text="s.title"></span>
                      <span class="mt-0.5 block truncate text-xs whitespace-nowrap text-(--text-muted)">
                        <span x-text="formatDate(s.updatedAt)"></span>
                        · <span x-text="s.chain.length"></span> links
                      </span>
                    </button>
                    <span class="mt-0.5 flex shrink-0 items-center gap-1.5">
                      <button
                        type="button"
                        @click.stop="toggleArchive(s.id)"
                        aria-label="Restore session"
                        title="Restore"
                        class="btn-icon cursor-pointer text-(--text-muted) transition hover:text-(--text-secondary)"
                      >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5">
                          <path d="M3 7v13a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7" />
                          <rect x="2" y="3" width="20" height="4" rx="1" />
                          <path d="M12 17v-6" /><path d="M9 14l3-3 3 3" />
                        </svg>
                      </button>
                      <button type="button"
                        @click.stop="deleteSession(s.id)"
                        aria-label="Delete session"
                        title="Delete session"
                        class="btn-icon cursor-pointer text-(--text-muted) transition hover:text-(--danger)"
                      >✕</button>
                    </span>
                  </div>
                </li>
              </template>
            </ul>
          </div>

          <!-- Backup: sessions only — providers and API keys never leave Settings -->
          <div class="flex items-center justify-between border-t border-(--border-default) px-2 py-1.5">
            <button
              @click="exportSessions()"
              class="btn btn-ghost btn-xs"
              title="Download every session as a JSON file (providers and API keys are not included)"
            >Export</button>
            <label class="btn btn-ghost btn-xs cursor-pointer" title="Restore sessions from an exported JSON file">
              Import
              <input type="file" accept="application/json,.json" class="sr-only" @change="importSessions($event)" />
            </label>
          </div>
        </aside>

        <!-- Right: enhancement chain — every column is one link with its own settings -->
        <section class="flex min-h-0 min-w-0 flex-col">
          <template x-if="providers.length === 0">
            <div class="mb-3 flex flex-wrap items-center justify-between gap-2 rounded-(--radius-md) bg-(--warning-soft) px-3 py-2 text-xs text-(--warning)">
              <span>No providers configured yet — enhancing needs an OpenAI-compatible endpoint and API key. You can still write and organize prompts.</span>
              <a href="./settings.html" class="btn btn-primary btn-xs">Add a provider</a>
            </div>
          </template>

          <!-- Sliding chain viewport: all horizontal motion happens in here -->
          <div class="min-h-0 min-w-0 flex-1 overflow-clip">
            <div class="chain-track h-full" :style="`--view-index: ${session.viewIndex}`">
              <template x-for="(col, i) in session.chain" :key="col.id">
                <!-- Slot: always in the track so widths and positions hold for
                     the whole chain. Its card is only mounted near the view
                     window (see isMounted) — a column is ~70 directives, and
                     rendering every link made session switches and slides
                     slow on long chains. State lives in the data, so
                     unmounting loses nothing but scroll position. -->
                <div
                  @click="selectPreview(col)"
                  class="chain-slot"
                  :data-past="i < session.viewIndex"
                  :inert="isOutOfView(i)"
                >
                <template x-if="isMounted(i)">
                <!-- The column is a scrolling card plus a fixed action row.
                     Enhance lives OUTSIDE the scroller so it is always on
                     screen whatever the column height — no sticky positioning,
                     and nothing for the advanced-settings overlay to collide
                     with. The container query lives here, on the element whose
                     width is the column's. -->
                <div class="chain-column @container flex h-full flex-col gap-2.5 px-1.5">
                <div class="chain-card flex min-h-0 flex-1 flex-col gap-2.5">
                  <!-- Column header: version badge + lineage + actions.
                       The accent ring marks the column shown in the preview. -->
                  <div class="card flex items-center gap-2.5 px-3 py-2" :class="previewColumn.id === col.id ? 'ring-1 ring-(--accent-ring)' : ''">
                    <!-- The badge doubles as this column's preview selector:
                         a real button, so choosing what the preview shows is
                         reachable from the keyboard, not only by clicking the
                         column. It also carries the timestamp, which no longer
                         competes with the lineage for header width. -->
                    <button
                      type="button"
                      @click.stop="selectPreview(col)"
                      :aria-pressed="previewColumn.id === col.id"
                      :title="`Show v${i + 1} in the Markdown preview · created ${formatDate(col.createdAt)}`"
                      class="version-badge shrink-0"
                    >
                      <span class="version-prefix">v</span><span x-text="i + 1"></span>
                    </button>
                    <span class="min-w-0 flex-1">
                      <span class="block truncate text-sm font-semibold text-(--text-primary)">
                        <span x-show="i === 0">Original prompt</span>
                        <span x-show="i > 0" x-cloak>Enhanced from <span class="font-semibold text-(--accent-text) tabular-nums" x-text="`v${i}`"></span></span>
                      </span>
                      <span class="block truncate text-xs text-(--text-muted)" x-text="col.producedBy ? `by ${col.producedBy}` : (i === 0 ? 'written by you' : 'provider not recorded')"></span>
                    </span>
                    <span class="flex shrink-0 items-center gap-2 text-xs text-(--text-muted)">
                      <!-- Only wide columns can spare room for the timestamp;
                           below that the lineage above wins, and the badge's
                           tooltip still carries the date. -->
                      <span class="hidden @xl:inline" x-text="formatDate(col.createdAt)"></span>
                      <!-- Cancel lives on the column being streamed into: on
                           narrow screens the source column has already slid
                           into the past (inert) by the time this is needed. -->
                      <button
                        x-show="enhancing?.targetId === col.id"
                        x-cloak
                        @click.stop="cancelEnhance()"
                        class="btn btn-danger-ghost btn-xs"
                      >Cancel</button>
                      <button
                        @click.stop="copyColumn(col)"
                        :aria-label="copiedId === col.id ? 'Prompt copied to clipboard' : `Copy ${i === 0 ? 'original prompt' : 'enhanced prompt'} to clipboard`"
                        class="btn btn-outline btn-xs"
                        :class="copiedId === col.id ? 'text-(--success)' : ''"
                        x-text="copiedId === col.id ? 'Copied!' : 'Copy'"
                      ></button>
                    </span>
                  </div>

                  <!-- Advanced settings trigger (independent per column). The
                       settings themselves open as an overlay panel over the
                       editor area below (see .advanced-panel), so toggling
                       never displaces the editor, instruction, or Enhance. -->
                  <div class="card" :class="advancedOpen(col) ? 'ring-1 ring-(--accent-ring)' : ''">
                    <button
                      @click="toggleAdvanced(col, $el)"
                      :aria-expanded="advancedOpen(col)"
                      class="flex w-full items-center gap-2 px-3 py-2"
                    >
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="h-3.5 w-3.5 shrink-0 text-(--text-muted)" aria-hidden="true">
                        <line x1="21" y1="7" x2="14" y2="7" /><line x1="10" y1="7" x2="3" y2="7" />
                        <line x1="21" y1="17" x2="16" y2="17" /><line x1="12" y1="17" x2="3" y2="17" />
                        <line x1="14" y1="5" x2="14" y2="9" /><line x1="16" y1="15" x2="16" y2="19" />
                      </svg>
                      <span class="text-sm font-semibold text-(--text-primary)">
                        Advanced settings
                        <span class="font-normal text-(--text-muted)">for <span class="font-semibold text-(--accent-text) tabular-nums" x-text="`v${i + 2}`"></span></span>
                      </span>
                      <span class="min-w-0 flex-1 truncate text-right text-xs text-(--text-muted)" x-text="advancedSummary(col)"></span>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5 shrink-0 text-(--text-muted) transition-transform duration-200 motion-reduce:transition-none" :class="advancedOpen(col) ? 'rotate-180' : ''" aria-hidden="true">
                        <path d="m6 9 6 6 6-6" />
                      </svg>
                    </button>
                  </div>

                  <!-- Prompt editor + instruction + Enhance form one pinned
                       group: it grows to fill the space left by the header and
                       trigger above, so the instruction and Enhance button
                       always sit at the bottom of the prompt area. The inner
                       wrapper is the positioning context for the Advanced
                       settings overlay: the panel floats over the editor,
                       reasoning and instruction, leaving Enhance visible. -->
                  <div class="chain-editor-group flex flex-1 flex-col gap-2.5">
                    <div class="relative flex min-h-0 flex-1 flex-col gap-2.5">
                      <!-- Editable prompt text -->
                      <div class="chain-editor card flex min-h-0 flex-1 flex-col">
                        <div class="flex items-baseline justify-between gap-2 border-b border-(--border-default) px-3 py-2">
                          <!-- The title never wraps and the readout absorbs the
                               shrinking: a wrapped "Enhanced prompt" pushed this
                               column's text down a line and broke the baseline
                               it shares with the column beside it. -->
                          <span class="shrink-0 text-sm font-semibold whitespace-nowrap text-(--text-primary)" x-text="i === 0 ? 'Your prompt' : 'Enhanced prompt'"></span>
                          <span class="min-w-0 truncate text-xs text-(--text-muted) tabular-nums" :title="i > 0 ? `Word change is relative to v${i}` : ''" x-text="lengthSummary(col, i)"></span>
                        </div>
                        <!-- Read-only while the model is streaming into it:
                             every frame assigns the whole accumulated response,
                             so anything typed here mid-stream was overwritten
                             without warning. Still focusable, so text can be
                             selected and copied as it arrives. -->
                        <textarea
                          x-model="col.text"
                          :readonly="enhancing?.targetId === col.id"
                          @input="touch()"
                          @keydown.ctrl.enter.prevent="enhanceShortcut(i)"
                          @keydown.meta.enter.prevent="enhanceShortcut(i)"
                          :placeholder="i === 0 ? 'Write or paste the prompt you want to enhance — any language works.' : 'The enhanced prompt appears here — edit it freely before the next enhancement.'"
                          class="min-h-0 flex-1 resize-none bg-transparent p-3 text-sm leading-relaxed text-(--text-primary) placeholder:text-(--text-faint) focus:outline-none"
                        ></textarea>
                      </div>

                      <!-- Reasoning: chain-of-thought captured while producing
                           this link. One strip morphs from live "Thinking…"
                           into a collapsed, expandable "Thought for Ns"
                           summary — collapsed by default. It sits below the
                           editor rather than above it because only enhanced
                           columns ever have one: above, it pushed this column's
                           editor down and broke the side-by-side alignment that
                           the whole two-column comparison depends on. -->
                      <div x-show="col.reasoning || thinkingId === col.id" x-cloak class="card-inset shrink-0">
                        <button
                          type="button"
                          @click="toggleReasoning(col)"
                          :aria-expanded="reasoningOpen(col)"
                          class="thinking-header"
                        >
                          <span class="thinking-dot" :class="thinkingId === col.id ? 'is-pulsing' : ''" aria-hidden="true"></span>
                          <span
                            class="font-medium text-(--text-secondary)"
                            x-text="thinkingId === col.id
                              ? `Thinking… ${thinkingSeconds}s`
                              : (col.reasoningSeconds ? `Thought for ${col.reasoningSeconds}s` : 'Reasoning')"
                          ></span>
                          <span class="ml-auto text-(--text-muted)" x-text="reasoningOpen(col) ? '▲' : '▼'"></span>
                        </button>
                        <div x-show="reasoningOpen(col)" role="region" aria-label="Model reasoning">
                          <pre
                            class="thinking-text"
                            x-text="col.reasoning || 'Waiting for the model\'s reasoning…'"
                            x-effect="if (thinkingId === col.id && col.reasoning) $el.scrollTop = $el.scrollHeight"
                          ></pre>
                        </div>
                      </div>

                      <!-- Enhancement instruction (independent per column) -->
                      <div class="card shrink-0">
                        <div class="flex flex-wrap items-baseline justify-between gap-x-2 border-b border-(--border-default) px-3 py-1.5">
                          <span class="text-sm font-semibold text-(--text-primary)">Instruction <span class="font-normal text-(--text-faint)">(optional)</span></span>
                          <span class="hidden text-xs text-(--text-muted) @lg:inline">guides this column's enhancement</span>
                        </div>
                        <textarea
                          x-model="col.instruction"
                          @input="persist()"
                          @keydown.ctrl.enter.prevent="enhanceShortcut(i)"
                          @keydown.meta.enter.prevent="enhanceShortcut(i)"
                          rows="2"
                          placeholder="e.g. Make it more formal · Turn it into a step-by-step task"
                          class="w-full resize-none bg-transparent px-3 py-2 text-sm leading-relaxed text-(--text-primary) placeholder:text-(--text-faint) focus:outline-none"
                        ></textarea>
                      </div>
                      <!-- Advanced settings overlay: floats over the editor
                           + instruction area, so opening it never displaces
                           them or the Enhance button below. `toggleAdvanced`
                           focuses it on open and returns focus to the trigger
                           on close, so Escape is scoped to the panel rather
                           than bound to the window from every mounted column. -->
                      <div
                        x-show="advancedOpen(col)"
                        x-cloak
                        tabindex="-1"
                        @keydown.escape.stop="closeAdvanced(col)"
                        x-transition:enter="transition duration-200 ease-out motion-reduce:transition-none"
                        x-transition:enter-start="translate-y-2 opacity-0"
                        x-transition:enter-end="translate-y-0 opacity-100"
                        x-transition:leave="transition duration-150 ease-in motion-reduce:transition-none"
                        x-transition:leave-start="translate-y-0 opacity-100"
                        x-transition:leave-end="translate-y-2 opacity-0"
                        role="region"
                        aria-label="Advanced settings"
                        class="advanced-panel"
                      >
                        <div class="flex items-center justify-between gap-2 border-b border-(--border-default) px-3 py-2">
                          <span class="min-w-0 flex-1">
                            <span class="block truncate text-sm font-semibold text-(--text-primary)">
                              Advanced settings
                              <span class="font-normal text-(--text-muted)">for <span class="font-semibold text-(--accent-text) tabular-nums" x-text="`v${i + 2}`"></span></span>
                            </span>
                            <!-- Wraps rather than truncates: cut to one line in
                                 a normal-width column, this read "…not v" and
                                 lost the distinction it exists to make. -->
                            <span class="block text-xs text-(--text-muted)" x-text="`These control the next enhancement, not v${i + 1} itself.`"></span>
                          </span>
                          <button @click="closeAdvanced(col)" class="btn btn-soft btn-xs shrink-0">Done</button>
                        </div>
                        <!-- Body built only while the panel is open: it holds four selects with
                             their option lists and every toggle, and a column is mounted merely
                             by scrolling near it. -->
                        <template x-if="advancedOpen(col)">
                        <div class="advanced-panel-body space-y-2.5 px-3 py-2.5">
                          <div class="grid grid-cols-2 gap-2 @lg:grid-cols-3">
                            <label class="block">
                              <span class="field-label">Enhancer provider</span>
                              <select
                                x-model="col.settings.providerId"
                                x-effect="$nextTick(() => { $el.value = col.settings.providerId })"
                                @change="onProviderChange(col)"
                                class="field field-xs"
                              >
                                <option value="" disabled>Select…</option>
                                <template x-for="p in providers" :key="p.id">
                                  <option :value="p.id" x-text="p.name"></option>
                                </template>
                              </select>
                            </label>
                            <label class="block">
                              <span class="field-label">Enhancer model</span>
                              <select
                                x-model="col.settings.modelId"
                                x-effect="$nextTick(() => { $el.value = col.settings.modelId })"
                                @change="persist()"
                                class="field field-xs"
                              >
                                <option value="" disabled>Select…</option>
                                <template x-for="m in modelsFor(col)" :key="m.id">
                                  <option :value="m.id" x-text="m.label || m.modelId"></option>
                                </template>
                              </select>
                            </label>
                            <label class="block">
                              <span class="field-label">Output language</span>
                              <input
                                type="text"
                                x-model="col.settings.outputLanguage"
                                @change="persist()"
                                list="languages"
                                placeholder="English"
                                class="field field-xs"
                              />
                            </label>
                            <label class="block">
                              <span class="field-label">Output format</span>
                              <select
                                x-model="col.settings.outputFormat"
                                x-effect="$nextTick(() => { $el.value = col.settings.outputFormat })"
                                @change="persist()"
                                class="field field-xs"
                              >
                                <template x-for="f in outputFormats" :key="f.value">
                                  <option :value="f.value" x-text="f.label"></option>
                                </template>
                              </select>
                            </label>
                          </div>
                          <div class="grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs text-(--text-secondary) @lg:grid-cols-3">
                            <label class="flex cursor-pointer items-center gap-1.5">
                              <input type="checkbox" x-model="col.settings.options.clarity" @change="persist()" class="checkbox" /> Clarity
                            </label>
                            <label class="flex cursor-pointer items-center gap-1.5">
                              <input type="checkbox" x-model="col.settings.options.structure" @change="persist()" class="checkbox" /> Structure
                            </label>
                            <label class="flex cursor-pointer items-center gap-1.5">
                              <input type="checkbox" x-model="col.settings.options.bestPractices" @change="persist()" class="checkbox" /> Best practices
                            </label>
                            <label class="flex cursor-pointer items-center gap-1.5">
                              <input type="checkbox" x-model="col.settings.options.tokenEfficiency" @change="persist()" class="checkbox" /> Token efficiency
                            </label>
                            <label class="flex cursor-pointer items-center gap-1.5">
                              <input type="checkbox" x-model="col.settings.options.preserveIntent" @change="persist()" class="checkbox" /> Preserve intent
                            </label>
                            <label class="flex cursor-pointer items-center gap-1.5" title="Hard cap: the enhanced prompt must be no longer than the original. Supersedes Token efficiency.">
                              <input type="checkbox" x-model="col.settings.options.brevity" @change="persist()" class="checkbox" /> Brevity
                            </label>
                            <label class="flex cursor-pointer items-center gap-1.5" title="Append a short explanation of the changes after the enhanced prompt">
                              <input type="checkbox" x-model="col.settings.options.commentary" @change="persist()" class="checkbox" /> Commentary
                            </label>
                          </div>

                          <!-- Target optimization: what the enhanced prompt is FOR (not the enhancer) -->
                          <div class="card-inset p-2.5">
                            <div class="mb-1.5 flex flex-wrap items-baseline justify-between gap-x-2">
                              <span class="text-xs font-semibold text-(--text-secondary)">Target optimization <span class="font-normal text-(--text-faint)">(optional)</span></span>
                              <span class="hidden text-xs text-(--text-faint) @lg:inline">where the enhanced prompt will be used</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 @lg:grid-cols-3">
                              <label class="block">
                                <span class="field-label">Target platform</span>
                                <input
                                  type="text"
                                  x-model="col.settings.target.platform"
                                  @change="persist()"
                                  list="target-platforms"
                                  placeholder="e.g. Claude Code"
                                  class="field field-xs"
                                />
                              </label>
                              <label class="block">
                                <span class="field-label">Target model</span>
                                <input
                                  type="text"
                                  x-model="col.settings.target.model"
                                  @change="persist()"
                                  placeholder="e.g. claude-sonnet-5"
                                  class="field field-xs"
                                />
                              </label>
                              <label class="col-span-2 block @lg:col-span-1">
                                <span class="field-label">Target type</span>
                                <input
                                  type="text"
                                  x-model="col.settings.target.type"
                                  @change="persist()"
                                  list="target-types"
                                  placeholder="e.g. Coding agent"
                                  class="field field-xs"
                                />
                              </label>
                            </div>
                            <!-- The "Best practices" option above is the master
                                 switch: with it off, selected collections are
                                 not sent, so the list is disabled and says so
                                 rather than silently dropping the selection. -->
                            <div class="mt-2" :class="col.settings.options.bestPractices ? '' : 'opacity-40'">
                              <span class="field-label">Best-practice collections</span>
                              <template x-if="bestPractices.length === 0">
                                <p class="text-xs text-(--text-faint)">
                                  None defined yet — create collections in
                                  <a href="./settings.html" class="underline hover:text-(--text-secondary)">Settings</a>.
                                </p>
                              </template>
                              <div class="flex flex-wrap gap-x-3 gap-y-1.5 text-xs text-(--text-secondary)">
                                <template x-for="bp in bestPractices" :key="bp.id">
                                  <label
                                    class="flex items-center gap-1.5"
                                    :class="col.settings.options.bestPractices ? 'cursor-pointer' : 'cursor-not-allowed'"
                                    :title="bp.target ? `For ${bp.target}` : ''"
                                  >
                                    <input
                                      type="checkbox"
                                      :checked="isPracticeSelected(col, bp.id)"
                                      :disabled="!col.settings.options.bestPractices"
                                      @change="togglePractice(col, bp.id)"
                                      class="checkbox"
                                    />
                                    <span x-text="bp.name"></span>
                                    <span x-show="bp.target" class="text-(--text-faint)" x-text="`(${bp.target})`"></span>
                                  </label>
                                </template>
                              </div>
                            </div>
                            <p
                              x-show="!col.settings.options.bestPractices && selectedPracticeCount(col) > 0"
                              x-cloak
                              class="mt-2 rounded-(--radius-md) bg-(--warning-soft) px-2 py-1.5 text-xs text-(--warning)"
                              x-text="`${selectedPracticeCount(col)} collection${selectedPracticeCount(col) === 1 ? '' : 's'} selected but not applied — turn on the “Best practices” option above to use ${selectedPracticeCount(col) === 1 ? 'it' : 'them'}.`"
                            ></p>
                          </div>
                        </div>
                        </template>
                      </div>
                    </div>

                  </div>
                </div>

                    <!-- Enhance: generates the next link in the chain. Outside
                         `.chain-card`, so it cannot scroll out of sight the way
                         it did at 1024×768 and below. -->
                    <div class="chain-actions shrink-0">
                      <!-- .stop: the column's own click handler would otherwise
                           re-select this column for the preview, undoing
                           enhanceFrom's switch to the newest link. -->
                      <button
                        @click.stop="enhanceFrom(i)"
                        :disabled="!canEnhance(col)"
                        :title="enhanceBlocker(col) || 'Ctrl+Enter or ⌘+Enter from the editor'"
                        class="btn btn-primary min-w-1/3 rounded-(--radius-md) px-3 py-2.5"
                      >
                        <span x-show="enhancing?.sourceId !== col.id" class="truncate" x-text="`✨ Enhance → v${i + 2}`"></span>
                        <span x-show="enhancing?.sourceId === col.id" x-cloak class="flex items-center gap-2">
                          <span class="size-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                          Enhancing…
                        </span>
                      </button>
                    </div>
                </div>
                </template>
                </div>
              </template>
            </div>
          </div>

          <!-- Enhancement failures: role="alert" so they are announced, matching
               the storage banner, and dismissible so a stale one doesn't sit
               under the chain until the next run. -->
          <div
            x-show="error"
            x-cloak
            role="alert"
            class="mt-3 flex items-start gap-3 rounded-(--radius-md) bg-(--danger-soft) px-4 py-2.5 text-sm text-(--danger)"
          >
            <span class="min-w-0 flex-1" x-text="error"></span>
            <button @click="error = ''" class="btn btn-danger-ghost btn-xs shrink-0">Dismiss</button>
          </div>
          <div
            x-show="notice"
            x-cloak
            role="status"
            class="mt-3 flex items-start gap-3 rounded-(--radius-md) bg-(--accent-soft) px-4 py-2.5 text-sm text-(--accent-text)"
          >
            <span class="min-w-0 flex-1" x-text="notice"></span>
            <!-- Enhancing an earlier column deletes every later link; they stay
                 restorable for as long as this notice is up. -->
            <button
              x-show="undoReplace"
              @click="restoreReplaced()"
              class="btn btn-soft btn-xs shrink-0"
            >Undo</button>
          </div>

          <!-- Chain navigation: arrows plus one pill per version. Pills for
               the columns in view are highlighted; clicking one slides to
               it and shows it in the preview. The right slot re-opens a
               hidden preview pane. -->
          <div class="mt-3 grid grid-cols-[1fr_auto_1fr] items-center gap-2">
            <span></span>
            <div class="flex min-w-0 items-center justify-center gap-2">
              <button
                @click="prevView()"
                :disabled="session.viewIndex === 0"
                title="Earlier links in the chain (←)"
                class="btn btn-outline px-4 py-1.5"
              >←</button>
              <!-- x-effect keeps the leading column's pill in view: the strip
                   scrolls on long chains and hides its scrollbar, so the
                   current position otherwise vanished off the left edge. -->
              <div
                class="chain-pills"
                role="group"
                aria-label="Versions in the chain"
                x-ref="pills"
                x-effect="scrollPillIntoView(session.viewIndex)"
              >
                <template x-for="(col, i) in session.chain" :key="col.id">
                  <button
                    @click="goToView(i)"
                    :class="isVisibleColumn(i) ? 'btn-soft' : 'btn-ghost'"
                    :aria-current="isVisibleColumn(i) ? 'true' : null"
                    :title="`Show v${i + 1}${previewColumn.id === col.id ? ' (in preview)' : ''}`"
                    class="btn btn-xs tabular-nums"
                    x-text="`v${i + 1}`"
                  ></button>
                </template>
              </div>
              <button
                @click="nextView()"
                :disabled="session.viewIndex >= maxViewIndex"
                title="Later links in the chain (→)"
                class="btn btn-outline px-4 py-1.5"
              >→</button>
            </div>
            <button
              x-show="layout.previewCollapsed"
              x-cloak
              @click="togglePreview()"
              class="btn btn-ghost btn-xs justify-self-end"
              title="Show the Markdown preview pane"
            >Show preview</button>
          </div>

          <datalist id="target-platforms">
            <template x-for="p in targetPlatforms" :key="p"><option :value="p"></option></template>
          </datalist>
          <datalist id="target-types">
            <template x-for="t in targetTypes" :key="t"><option :value="t"></option></template>
          </datalist>
          <datalist id="languages">
            <option>English</option><option>Persian</option><option>German</option>
            <option>French</option><option>Spanish</option><option>Arabic</option>
            <option>Chinese</option><option>Japanese</option>
          </datalist>
        </section>

        <!-- Fourth column: rendered Markdown of the selected chain link.
             Click a column to preview it; defaults to the newest link. -->
        <aside x-ref="previewPane" x-show="!layout.previewCollapsed" class="card relative flex max-h-56 min-h-0 flex-col md:col-span-2 md:max-h-64 xl:col-span-1 xl:col-start-3 xl:max-h-none">
          <div
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize Markdown preview"
            :aria-valuenow="paneWidth('preview')"
            :aria-valuemin="paneLimits.preview.min"
            :aria-valuemax="paneLimits.preview.max"
            tabindex="0"
            title="Drag to resize · double-click to reset"
            @pointerdown="startResize('preview', $event)"
            @keydown="resizeKey('preview', $event)"
            @dblclick="resetPane('preview')"
            class="resize-handle resize-handle-start"
            :class="resizing === 'preview' ? 'is-active' : ''"
          ></div>
          <div class="flex items-center justify-between gap-2 border-b border-(--border-default) px-4 py-2.5">
            <h2 class="shrink-0 text-sm font-semibold whitespace-nowrap text-(--text-primary)">Markdown preview</h2>
            <span class="flex min-w-0 items-center gap-2 text-xs text-(--text-muted)">
              <span class="truncate tabular-nums" :title="`Showing v${previewVersion} · ${previewLength}`">
                <span class="font-semibold text-(--accent-text)" x-text="`v${previewVersion}`"></span>
                · <span x-text="previewWords"></span>
              </span>
              <button @click="togglePreview()" class="btn btn-ghost btn-xs shrink-0" title="Hide the preview pane — reopen it from the chain navigation">Hide</button>
            </span>
          </div>
          <template x-if="previewHtml">
            <div class="markdown-body min-h-0 flex-1 overflow-y-auto p-4" x-html="previewHtml"></div>
          </template>
          <template x-if="!previewHtml">
            <p class="p-4 text-xs text-(--text-faint)">
              Nothing to preview yet — this link's prompt is empty. Click any
              column in the chain to preview it here.
            </p>
          </template>
        </aside>
      </main>

      <!-- Footer -->
      <footer
        class="flex flex-wrap items-center justify-center gap-x-2 gap-y-1 border-t border-(--border-default) px-6 py-2.5 text-center text-xs text-(--text-muted)"
      >
        <span>Prompt Enhancer — runs entirely in your browser · all data stays in local storage</span>
        <!-- Build stamp injected by src/build-info.ts (values baked in by Vite). -->
        <span class="tabular-nums text-(--text-faint)" data-build-info></span>
      </footer>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Enhancer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
    <script>
      // Apply the saved theme before first paint to avoid a flash
      const saved = localStorage.getItem('pe.theme')
      if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="h-full bg-(--surface-page) text-(--text-secondary) antialiased">
    <div x-data="mainApp" x-cloak class="flex h-full flex-col">
      <!-- Header -->
      <header class="flex items-center justify-between border-b border-(--border-default) bg-white/70 px-4 py-3 backdrop-blur sm:px-6 dark:bg-slate-900/70">
        <a href="./" class="flex items-center gap-2.5">
          <span class="grid size-8 place-items-center rounded-(--radius-sm) bg-(--accent-soft) text-lg">✨</span>
          <span class="text-base font-semibold tracking-tight text-(--text-primary)">Prompt Enhancer</span>
        </a>
        <nav class="flex items-center gap-1 text-sm">
          <a href="./" class="btn btn-soft">Enhance</a>
          <a href="./settings.html" class="btn btn-ghost">Settings</a>
          <button
            @click="toggleTheme()"
            :title="theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
            class="btn btn-ghost ml-1 px-2.5"
            x-text="theme === 'dark' ? '☀️' : '🌙'"
          ></button>
        </nav>
      </header>

      <!-- Main: sessions sidebar + enhancement chain -->
      <main class="grid min-h-0 flex-1 grid-cols-1 gap-4 p-4 md:grid-cols-[16rem_1fr]">
        <!-- Left: sessions -->
        <aside class="card flex min-h-0 max-h-48 flex-col md:max-h-none">
          <div class="flex items-center justify-between border-b border-(--border-default) px-4 py-3">
            <h2 class="text-sm font-semibold text-(--text-primary)">Sessions</h2>
            <button @click="createSession()" class="btn btn-primary btn-xs">+ New</button>
          </div>
          <ul class="min-h-0 flex-1 space-y-1 overflow-y-auto p-2">
            <template x-for="s in sortedSessions" :key="s.id">
              <li>
                <button
                  @click="openSession(s.id)"
                  class="group flex w-full items-start justify-between gap-2 rounded-(--radius-md) px-3 py-2 text-left transition"
                  :class="s.id === activeId ? 'bg-(--accent-soft) ring-1 ring-(--accent-ring)' : 'hover:bg-(--surface-hover)'"
                >
                  <span class="min-w-0">
                    <span class="block truncate text-sm" :class="s.id === activeId ? 'font-medium text-(--text-primary)' : 'text-(--text-secondary)'" x-text="s.title"></span>
                    <span class="mt-0.5 block text-xs text-(--text-muted)">
                      <span x-text="formatDate(s.updatedAt)"></span>
                      · <span x-text="s.chain.length"></span> links
                    </span>
                  </span>
                  <span
                    @click.stop="deleteSession(s.id)"
                    title="Delete session"
                    class="mt-0.5 hidden shrink-0 cursor-pointer text-(--text-muted) group-hover:block hover:text-(--danger)"
                  >✕</span>
                </button>
              </li>
            </template>
          </ul>
        </aside>

        <!-- Right: enhancement chain — every column is one link with its own settings -->
        <section class="flex min-h-0 flex-col">
          <template x-if="providers.length === 0">
            <p class="mb-3 rounded-(--radius-sm) bg-(--warning-soft) px-3 py-2 text-xs text-(--warning)">
              No providers configured yet —
              <a href="./settings.html" class="underline">add one in Settings</a>.
            </p>
          </template>

          <!-- Two-column sliding viewport -->
          <div class="min-h-0 flex-1 overflow-hidden">
            <div class="chain-track h-full" :style="`--view-index: ${session.viewIndex}`">
              <template x-for="(col, i) in session.chain" :key="col.id">
                <div
                  class="chain-card flex h-full flex-col gap-3 px-1.5"
                  :data-hidden="i < session.viewIndex || i > session.viewIndex + 1"
                  :data-past="i < session.viewIndex"
                >
                  <!-- Column header: version badge + lineage + actions -->
                  <div class="card flex items-center gap-3 px-4 py-2.5">
                    <span class="version-badge shrink-0" :title="`Version ${i + 1} in the enhancement chain`">
                      <span class="version-prefix">v</span><span x-text="i + 1"></span>
                    </span>
                    <span class="min-w-0 flex-1">
                      <span class="block truncate text-sm font-semibold text-(--text-primary)" x-text="i === 0 ? 'Original prompt' : `Enhanced from v${i}`"></span>
                      <span class="block truncate text-xs text-(--text-muted)" x-text="col.producedBy ? `by ${col.producedBy}` : 'written by you'"></span>
                    </span>
                    <span class="flex shrink-0 items-center gap-2 text-xs text-(--text-muted)">
                      <span class="hidden sm:inline" x-text="formatDate(col.createdAt)"></span>
                      <button
                        @click="copyColumn(col)"
                        :aria-label="copiedId === col.id ? 'Prompt copied to clipboard' : `Copy ${i === 0 ? 'original prompt' : 'enhanced prompt'} to clipboard`"
                        class="btn btn-outline btn-xs"
                        :class="copiedId === col.id ? 'text-(--success)' : ''"
                        x-text="copiedId === col.id ? 'Copied!' : 'Copy'"
                      ></button>
                    </span>
                  </div>

                  <!-- Advanced settings (independent per column) -->
                  <div class="card">
                    <button @click="col.showAdvanced = !col.showAdvanced; persist()" class="flex w-full items-center justify-between px-4 py-2.5">
                      <span class="text-sm font-semibold text-(--text-primary)">Advanced settings</span>
                      <span class="text-xs text-(--text-muted)" x-text="col.showAdvanced ? '▲' : '▼'"></span>
                    </button>
                    <div x-show="col.showAdvanced" class="space-y-3 border-t border-(--border-default) px-4 py-3">
                      <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
                        <label class="block">
                          <span class="field-label">Enhancer provider</span>
                          <select
                            x-model="col.settings.providerId"
                            x-effect="$nextTick(() => { $el.value = col.settings.providerId })"
                            @change="onProviderChange(col)"
                            class="field"
                          >
                            <option value="" disabled>Select…</option>
                            <template x-for="p in providers" :key="p.id">
                              <option :value="p.id" x-text="p.name"></option>
                            </template>
                          </select>
                        </label>
                        <label class="block">
                          <span class="field-label">Enhancer model</span>
                          <select
                            x-model="col.settings.modelId"
                            x-effect="$nextTick(() => { $el.value = col.settings.modelId })"
                            @change="persist()"
                            class="field"
                          >
                            <option value="" disabled>Select…</option>
                            <template x-for="m in modelsFor(col)" :key="m.id">
                              <option :value="m.id" x-text="m.label || m.modelId"></option>
                            </template>
                          </select>
                        </label>
                        <label class="block">
                          <span class="field-label">Output language</span>
                          <input
                            type="text"
                            x-model="col.settings.outputLanguage"
                            @change="persist()"
                            list="languages"
                            placeholder="English"
                            class="field"
                          />
                        </label>
                      </div>
                      <div class="flex flex-wrap gap-x-4 gap-y-2 text-xs text-(--text-secondary)">
                        <label class="flex cursor-pointer items-center gap-1.5">
                          <input type="checkbox" x-model="col.settings.options.clarity" @change="persist()" class="checkbox" /> Clarity
                        </label>
                        <label class="flex cursor-pointer items-center gap-1.5">
                          <input type="checkbox" x-model="col.settings.options.structure" @change="persist()" class="checkbox" /> Structure
                        </label>
                        <label class="flex cursor-pointer items-center gap-1.5">
                          <input type="checkbox" x-model="col.settings.options.bestPractices" @change="persist()" class="checkbox" /> Best practices
                        </label>
                        <label class="flex cursor-pointer items-center gap-1.5">
                          <input type="checkbox" x-model="col.settings.options.tokenEfficiency" @change="persist()" class="checkbox" /> Token efficiency
                        </label>
                        <label class="flex cursor-pointer items-center gap-1.5">
                          <input type="checkbox" x-model="col.settings.options.preserveIntent" @change="persist()" class="checkbox" /> Preserve intent
                        </label>
                      </div>

                      <!-- Target optimization: what the enhanced prompt is FOR (not the enhancer) -->
                      <div class="card-inset p-3">
                        <div class="mb-2 flex flex-wrap items-baseline justify-between gap-x-2">
                          <span class="text-xs font-semibold text-(--text-secondary)">Target optimization <span class="font-normal text-(--text-faint)">(optional)</span></span>
                          <span class="text-[11px] text-(--text-faint)">where the enhanced prompt will be used</span>
                        </div>
                        <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
                          <label class="block">
                            <span class="field-label">Target platform</span>
                            <input
                              type="text"
                              x-model="col.settings.target.platform"
                              @change="persist()"
                              list="target-platforms"
                              placeholder="e.g. Claude Code"
                              class="field"
                            />
                          </label>
                          <label class="block">
                            <span class="field-label">Target model</span>
                            <input
                              type="text"
                              x-model="col.settings.target.model"
                              @change="persist()"
                              placeholder="e.g. claude-sonnet-5"
                              class="field"
                            />
                          </label>
                          <label class="block">
                            <span class="field-label">Target type</span>
                            <input
                              type="text"
                              x-model="col.settings.target.type"
                              @change="persist()"
                              list="target-types"
                              placeholder="e.g. Coding agent"
                              class="field"
                            />
                          </label>
                        </div>
                        <div class="mt-2.5">
                          <span class="field-label">Best-practice collections</span>
                          <template x-if="bestPractices.length === 0">
                            <p class="text-xs text-(--text-faint)">
                              None defined yet — create collections in
                              <a href="./settings.html" class="underline hover:text-(--text-secondary)">Settings</a>.
                            </p>
                          </template>
                          <div class="flex flex-wrap gap-x-4 gap-y-1.5 text-xs text-(--text-secondary)">
                            <template x-for="bp in bestPractices" :key="bp.id">
                              <label class="flex cursor-pointer items-center gap-1.5" :title="bp.target ? `For ${bp.target}` : ''">
                                <input
                                  type="checkbox"
                                  :checked="isPracticeSelected(col, bp.id)"
                                  @change="togglePractice(col, bp.id)"
                                  class="checkbox"
                                />
                                <span x-text="bp.name"></span>
                                <span x-show="bp.target" class="text-(--text-faint)" x-text="`(${bp.target})`"></span>
                              </label>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Reasoning: chain-of-thought captured while producing this link.
                       One strip morphs from live "Thinking…" into a collapsed,
                       expandable "Thought for Ns" summary — collapsed by default. -->
                  <div x-show="col.reasoning || thinkingId === col.id" x-cloak class="card-inset">
                    <button
                      type="button"
                      @click="toggleReasoning(col)"
                      :aria-expanded="col.showReasoning"
                      class="thinking-header"
                    >
                      <span class="thinking-dot" :class="thinkingId === col.id ? 'is-pulsing' : ''" aria-hidden="true"></span>
                      <span
                        class="font-medium text-(--text-secondary)"
                        x-text="thinkingId === col.id
                          ? `Thinking… ${thinkingSeconds}s`
                          : (col.reasoningSeconds ? `Thought for ${col.reasoningSeconds}s` : 'Reasoning')"
                      ></span>
                      <span class="ml-auto text-(--text-muted)" x-text="col.showReasoning ? '▲' : '▼'"></span>
                    </button>
                    <div x-show="col.showReasoning" role="region" aria-label="Model reasoning">
                      <pre
                        class="thinking-text"
                        x-text="col.reasoning || 'Waiting for the model\'s reasoning…'"
                        x-effect="if (thinkingId === col.id && col.reasoning) $el.scrollTop = $el.scrollHeight"
                      ></pre>
                    </div>
                  </div>

                  <!-- Editable prompt text -->
                  <div class="chain-editor card flex min-h-0 flex-1 flex-col">
                    <div class="border-b border-(--border-default) px-4 py-2.5 text-sm font-semibold text-(--text-primary)" x-text="i === 0 ? 'Your prompt' : 'Enhanced prompt'"></div>
                    <textarea
                      x-model="col.text"
                      @input="touch()"
                      :placeholder="i === 0 ? 'Write or paste the prompt you want to enhance — any language works.' : 'The enhanced prompt appears here — edit it freely before the next enhancement.'"
                      class="min-h-0 flex-1 resize-none bg-transparent p-4 text-sm leading-relaxed text-(--text-primary) placeholder:text-(--text-faint) focus:outline-none"
                    ></textarea>
                  </div>

                  <!-- Enhancement instruction (independent per column) -->
                  <div class="card">
                    <div class="flex flex-wrap items-baseline justify-between gap-x-2 border-b border-(--border-default) px-4 py-2">
                      <span class="text-sm font-semibold text-(--text-primary)">Instruction <span class="font-normal text-(--text-faint)">(optional)</span></span>
                      <span class="text-xs text-(--text-muted)">guides this column's enhancement</span>
                    </div>
                    <textarea
                      x-model="col.instruction"
                      @input="persist()"
                      rows="2"
                      placeholder="e.g. Make it more formal · Turn it into a step-by-step task"
                      class="w-full resize-none bg-transparent px-4 py-3 text-sm leading-relaxed text-(--text-primary) placeholder:text-(--text-faint) focus:outline-none"
                    ></textarea>
                  </div>

                  <!-- Enhance: generates the next link in the chain -->
                  <button
                    @click="enhanceFrom(i)"
                    :disabled="!canEnhance(col)"
                    class="btn btn-primary rounded-(--radius-md) px-4 py-3"
                  >
                    <span x-show="!enhancing" x-text="`✨ Enhance → v${i + 2}`"></span>
                    <span x-show="enhancing" x-cloak class="flex items-center gap-2">
                      <span class="size-4 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                      Enhancing…
                    </span>
                  </button>
                </div>
              </template>
            </div>
          </div>

          <p x-show="error" x-cloak class="mt-3 rounded-(--radius-md) bg-(--danger-soft) px-4 py-2.5 text-sm text-(--danger)" x-text="error"></p>

          <!-- Chain navigation -->
          <div class="mt-3 flex items-center justify-center gap-3">
            <button
              @click="prevView()"
              :disabled="session.viewIndex === 0"
              title="Earlier links in the chain"
              class="btn btn-outline px-4 py-1.5"
            >←</button>
            <span
              class="text-xs text-(--text-muted) tabular-nums"
              x-text="session.chain.length === 1
                ? '1 link in chain'
                : `Showing v${session.viewIndex + 1}–v${Math.min(session.viewIndex + 2, session.chain.length)} of ${session.chain.length} links`"
            ></span>
            <button
              @click="nextView()"
              :disabled="session.viewIndex >= maxViewIndex"
              title="Later links in the chain"
              class="btn btn-outline px-4 py-1.5"
            >→</button>
          </div>

          <datalist id="target-platforms">
            <template x-for="p in targetPlatforms" :key="p"><option :value="p"></option></template>
          </datalist>
          <datalist id="target-types">
            <template x-for="t in targetTypes" :key="t"><option :value="t"></option></template>
          </datalist>
          <datalist id="languages">
            <option>English</option><option>Persian</option><option>German</option>
            <option>French</option><option>Spanish</option><option>Arabic</option>
            <option>Chinese</option><option>Japanese</option>
          </datalist>
        </section>
      </main>

      <!-- Footer -->
      <footer class="border-t border-(--border-default) px-6 py-2.5 text-center text-xs text-(--text-muted)">
        Prompt Enhancer — runs entirely in your browser · all data stays in local storage
      </footer>
    </div>
  </body>
</html>
